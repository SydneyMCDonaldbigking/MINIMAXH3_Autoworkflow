defaults:
  user: root
  ssh_port: 22
  comfy_dir: /root/ComfyUI
  conda_sh: /home/node/anaconda3/etc/profile.d/conda.sh
  conda_env: comfy_h3_torch29_cu126
  python: python
  lowvram: true
  auto_start: true
  upload_runner: true
  remote_job_root: cluster_jobs

servers:
  - name: a100-cn-01
    host: 0.0.0.0
    ssh_port: 22
    workers:
      - name: gpu0
        gpu: 0
        comfy_port: 8189

  # Multi-GPU example: one ComfyUI worker per GPU.
